[project]
name = "dice"
version = "0.1.0"
description = "Dice simulation toolkit — roll dice, compute statistics, and visualize distributions"
license = "MIT"
readme = "README.md"
authors = [
    { name = "risira", email = "risira@stekz.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
dice = "dice:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["dice"]
